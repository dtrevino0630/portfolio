<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Walt Disney Imagineering 2025 Imaginations Photos | David Trevino</title>
  <link rel="stylesheet" href="style.css">

  <style>
    .gallery {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
      gap: 25px;
    }

    .gallery img,
    .gallery video {
      width: 100%;
      border-radius: 10px;
    }

    figure {
      background: white;
      padding: 12px;
      border-radius: 12px;
    }

    figcaption {
      margin-top: 8px;
      font-size: 0.9rem;
    }

    .subgallery {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      margin-top: 12px;
    }

    .subgallery img {
      width: 30%;
      border-radius: 6px;
    }

    h3 {
      margin-top: 40px;
    }
  </style>

</head>

<body style="background-color:#f0f6ff;">

  <!-- Navigation -->
  <nav id="menu">
    <ul>
      <li><a href="index.html">Home</a></li>
      <li><a href="projects.html">Projects</a></li>
      <li><a href="competitions.html" class="active">Competitions</a></li>
      <li><a href="resume.html">Resume/Skills</a></li>
      <li><a href="contact.html">Contact</a></li>
    </ul>
  </nav>

  <main class="content-section">

    <h2>Walt Disney Imagineering 2025 Imaginations Competition | Gallery</h2>

    <!-- ================= VIDEOS ================= -->
    <h3>Videos</h3>
    <div class="gallery">

      <figure>
        <video controls>
          <source src="videos/video1.mp4" type="video/mp4">
        </video>
        <figcaption>Vehicle animation walkthrough</figcaption>
      </figure>

      <figure>
        <video controls>
          <source src="videos/video2.mp4" type="video/mp4">
        </video>
        <figcaption>Ride system demonstration</figcaption>
      </figure>

    </div>


    <!-- ================= BRAINSTORMING ================= -->
    <h3>Brainstorming & Early Concepts</h3>
    <div class="gallery">

      <figure>
        <img src="images/brainstorm1.jpg" alt="Brainstorm Sketches">
        <figcaption>Initial brainstorming sketches and ideas</figcaption>
      </figure>

      <figure>
        <img src="images/brainstorm2.jpg" alt="Concept Development">
        <figcaption>Concept development and early layouts</figcaption>
      </figure>

    </div>


    <!-- ================= FINAL DESIGNS ================= -->
    <h3>Final Designs</h3>
    <div class="gallery">

      <!-- FINAL IMAGE 1 (WITH SUB IMAGES) -->
      <figure>
        <img src="images/final1.jpg" alt="Final Vehicle Design">
        <figcaption>Final vehicle design with detailed modeling</figcaption>

        <div class="subgallery">
          <img src="images/sub1.jpg" alt="">
          <img src="images/sub2.jpg" alt="">
          <img src="images/sub3.jpg" alt="">
          <img src="images/sub4.jpg" alt="">
          <img src="images/sub5.jpg" alt="">
          <img src="images/sub6.jpg" alt="">
          <img src="images/sub7.jpg" alt="">
        </div>
      </figure>

      <!-- FINAL IMAGE 2 -->
      <figure>
        <img src="images/final2.jpg" alt="Final Render">
        <figcaption>Final rendered concept of the attraction</figcaption>
      </figure>

    </div>


    <p style="margin-top:40px;">
      <a href="competitions.html" class="button">⬅ Back to Competitions</a>
    </p>

  </main>

</body>
</html>
