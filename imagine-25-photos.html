<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Walt Disney Imagineering 2025 Imaginations Photos | David Trevino</title>
  <link rel="stylesheet" href="style.css">

  <style>
    .gallery {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
      gap: 25px;
    }

    .gallery img,
    .gallery video {
      width: 100%;
      border-radius: 10px;
    }

    figure {
      background: white;
      padding: 12px;
      border-radius: 12px;
    }

    figcaption {
      margin-top: 8px;
      font-size: 0.9rem;
    }

    .subgallery {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      margin-top: 12px;
    }

    .subgallery img {
      width: 30%;
      border-radius: 6px;
    }

    h3 {
      margin-top: 40px;
    }
  </style>

</head>

<body style="background-color:#f0f6ff;">

  <!-- Navigation -->
  <nav id="menu">
    <ul>
      <li><a href="index.html">Home</a></li>
      <li><a href="projects.html">Projects</a></li>
      <li><a href="competitions.html" class="active">Competitions</a></li>
      <li><a href="resume.html">Resume/Skills</a></li>
      <li><a href="contact.html">Contact</a></li>
    </ul>
  </nav>

  <main class="content-section">

    <h2>Walt Disney Imagineering 2025 Imaginations Competition | Gallery</h2>

    <!-- ================= VIDEOS ================= -->
    <h3>Videos</h3>
    <div class="gallery">

      <figure>
        <video controls>
          <source src="videos/gear_stack.mp4" type="video/mp4">
        </video>
        <figcaption>Early brainstorming idea showcasing a tall stack of rotating gears.</figcaption>
      </figure>

      <figure>
        <video controls>
          <source src="videos/fountain_views.mp4" type="video/mp4">
        </video>
        <figcaption>Gear Garden Fountain Demonstration filmed using animation tools in SolidWorks.</figcaption>
      </figure>

    </div>


    <!-- ================= BRAINSTORMING ================= -->
    <h3>Brainstorming & Early Concepts</h3>
    <div class="gallery">

      <figure>
        <img src="images/fountain_brainstorm.png" alt="Brainstorm Sketches">
        <figcaption>Initial brainstorming sketches and ideas for the fountain</figcaption>
      </figure>

      <figure>
        <img src="images/top_view_fountain.png" alt="Concept Development">
        <figcaption>Top-view perspective of the fountain. The size and appearance of the fountain were adjusted in the final model.</figcaption>
      </figure>

    </div>


    <!-- ================= FINAL DESIGNS ================= -->
    <h3>Final Designs</h3>
    <div class="gallery">

      <!-- FINAL IMAGE 1 (WITH SUB IMAGES) -->
      <figure>
        <img src="images/isometric_fountain.jpg" alt="Final Vehicle Design">
        <figcaption>Final rendering of Gear Fountain that was modeled in SolidWorks and drawn on in Procreate to showcase the time of day. The following 7 modeling surrounding the gear reflect each engineering department at UT Austin.</figcaption>

        <div class="subgallery">
          <img src="images/AERO.jpg" alt="">
          <img src="images/BIOMED.jpg" alt="">
          <img src="images/CHEM.jpg" alt="">
          <img src="images/CAEE.jpg" alt="">
          <img src="images/ECE.jpg" alt="">
          <img src="images/MECH.jpg" alt="">
          <img src="images/PETROL.jpg" alt="">
        </div>
      </figure>

      <!-- FINAL IMAGE 2 -->
      <figure>
        <img src="images/campus_layout.jpg" alt="Final Render">
        <figcaption>Layout of UT Austin Campus to showcase the location of our space.</figcaption>
      </figure>

    </div>


    <p style="margin-top:40px;">
      <a href="competitions.html" class="button">⬅ Back to Competitions</a>
    </p>

  </main>

</body>
